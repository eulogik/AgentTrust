name: "OpenTrustBench CI Scanner"
description: "Scan AI agents and MCP servers for security flaws. A-F Trust Cards, SARIF reports, severity gates for CI."
author: "OpenTrustBench"
branding:
  icon: "shield"
  color: "blue"

inputs:
  target:
    description: "Path or directory to scan (defaults to repository root)"
    required: false
    default: "."
  format:
    description: "Report format: sarif, json, md, or terminal"
    required: false
    default: "sarif"
  output-dir:
    description: "Directory where reports are written"
    required: false
    default: "."
  fail-on:
    description: "Minimum severity that fails CI: info, low, medium, high, critical"
    required: false
    default: "high"

runs:
  using: "composite"
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: 20

    - name: Cache npm dependencies
      uses: actions/cache@v4
      with:
        path: ~/.npm
        key: opentrustbench-${{ runner.os }}-npm-${{ hashFiles('**/package-lock.json') }}
        restore-keys: |
          opentrustbench-${{ runner.os }}-npm-

    - name: Run OpenTrustBench scan
      shell: bash
      run: |
        npx -y @opentrustbench/cli@0.1.1 scan \
          "${{ inputs.target }}" \
          --format "${{ inputs.format }}" \
          --output-dir "${{ inputs.output-dir }}" \
          --fail-on "${{ inputs.fail-on }}" \
          --quiet --no-banner

    - name: Upload SARIF to Code Scanning
      if: always() && inputs.format == 'sarif'
      uses: github/codeql-action/upload-sarif@v3
      with:
        sarif_file: ${{ inputs.output-dir }}/opentrustbench-report.sarif
