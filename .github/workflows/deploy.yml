name: Deploy Site + Badges to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - 'badges/**'
      - '.github/workflows/deploy.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Pages
        uses: actions/configure-pages@v5

      - name: Build site
        run: |
          mkdir -p _site
          # Whole static site, including generated per-repo report pages (web/public/r/)
          cp -r web/public/. _site/
          # Grade badges (source of truth: badges/)
          mkdir -p _site/badge
          cp badges/*.svg _site/badge/

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
